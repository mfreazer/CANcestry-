# H-Phase 1 hardware PR gate (issue #33; HW-PLAN §7/§8.2, virtual-bench-plan §7).
#
# A single self-contained job (hosted-runner budget, HW-PLAN C5) that runs
# the whole H-01 evidence chain inside one digest-pinned container built
# from ci/docker/ (OpenModelica + FMPy + Python):
#
#   1. schema validation        (software + hardware schema trees)
#   2. HwRS parser + ledger     (unit tests, 100% coverage gate)
#   3. Modelica compile -> FMU  (omc, headless)
#   4. FMU oracle test          (FMPy vs OR-001, schema-declared tolerance)
#   5. traceability gate        (ci/check_hw_traceability.py)
#
# The base image digest pin is re-verified against the registry before any
# build (HwAGENTS.md rule 5: determinism) — a re-pushed base image fails
# this pipeline instead of silently changing the verification evidence.
#
# Heavy sweeps deliberately do not run here: hw-nightly.yml (H-02).

name: hw-fast

concurrency:
  group: hw-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "hw/**"
      - "docs/hw/**"
      - "schemas/hw/**"
      - "ci/**"
      - "HwAGENTS.md"
      - "agents.md"
      - ".github/workflows/hw-fast.yml"
  push:
    branches:
      - main
    paths:
      - "hw/**"
      - "docs/hw/**"
      - "schemas/hw/**"
      - "ci/**"
      - "HwAGENTS.md"
      - "agents.md"
      - ".github/workflows/hw-fast.yml"

jobs:
  hw-fast:
    name: hardware gates (schemas, FMU oracle, traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the base-image digest pin (ci/docker/base-image.digest)
        id: pin
        run: |
          set -euo pipefail
          PIN_LINES="$(grep -Ev '^[[:space:]]*(#|$)' ci/docker/base-image.digest)"
          REF="$(printf '%s\n' "$PIN_LINES" | sed -n '1p' | tr -d '[:space:]')"
          PINNED="$(printf '%s\n' "$PIN_LINES" | sed -n '2p' | tr -d '[:space:]')"
          RESOLVED="$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "$REF" | jq -r '.digest')"
          test -n "$RESOLVED" && test "$RESOLVED" != "null" || {
            echo "::error::could not resolve a manifest digest for $REF"
            exit 1
          }
          echo "base ref:   ${REF}"
          echo "pinned:     ${PINNED}"
          echo "resolved:   ${RESOLVED}"
          if [ "$PINNED" != "$RESOLVED" ]; then
            echo "::error::${REF} no longer resolves to the pinned digest ${PINNED}; the registry now serves ${RESOLVED}. Re-pin ci/docker/base-image.digest through a documented, QA-visible change instead."
            exit 1
          fi
          echo "image-digest=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Build the toolchain image (ci/docker)
        run: |
          set -euo pipefail
          docker build \
            -t "cancestry/hw-fast:${GITHUB_SHA}" \
            -t "cancestry/hw-fast:local" \
            ci/docker/ 2>&1 | tee /tmp/hw-fast-build.log
          docker inspect --format 'toolchain image: {{.Id}}' \
            "cancestry/hw-fast:${GITHUB_SHA}"

      - name: Surface toolchain build diagnostics
        if: failure()
        run: |
          set +e
          if [ -f /tmp/hw-fast-build.log ]; then
            {
              echo "## hw-fast Docker build tail"
              echo '```text'
              tail -120 /tmp/hw-fast-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::${line}"
            done < <(tail -40 /tmp/hw-fast-build.log)
          fi

      - name: Run the hardware gates
        env:
          CANCESTRY_HW_IMAGE: ${{ steps.pin.outputs.image-digest }}
        run: |
          set -euo pipefail
          IMAGE="cancestry/hw-fast:${GITHUB_SHA}"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CANCESTRY_HW_IMAGE \
            "$IMAGE" bash -lc '
              set -euo pipefail
              echo "== 1. Schema validation (software + hardware trees)"
              python3 ci/check_schemas_valid.py schemas || {
                echo "::error::hw-fast gate 1 failed: schema validation"
                exit 1
              }

              echo "== 2. HwRS parser + hardware ledger (unit tests, 95% branch coverage gate)"
              python3 -m coverage run --branch \
                --include=ci/check_hw_traceability.py \
                -m pytest tests/unit/tools/test_check_hw_traceability.py -q || {
                echo "::error::hw-fast gate 2 failed: checker unit tests"
                exit 1
              }
              python3 -m coverage report --fail-under=95 || {
                echo "::error::hw-fast gate 2 failed: checker branch coverage below 95%"
                exit 1
              }

              echo "== 3+4. Modelica compile -> FMU -> FMPy oracle test (OR-001)"
              python3 -m pytest hw/tests -v || {
                echo "::error::hw-fast gates 3+4 failed: Modelica/FMPy oracle test"
                exit 1
              }

              echo "== 5. Hardware traceability gate (honest ledger)"
              python3 ci/check_hw_traceability.py . || {
                echo "::error::hw-fast gate 5 failed: hardware traceability ledger"
                exit 1
              }
            ' 2>&1 | tee /tmp/hw-fast-output.log
          DOCKER_STATUS="${PIPESTATUS[0]}"
          if [ "$DOCKER_STATUS" -ne 0 ]; then
            {
              echo "## hw-fast gate output tail"
              echo '```text'
              tail -160 /tmp/hw-fast-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            DIAGNOSTIC="$(tail -80 /tmp/hw-fast-output.log | tr '\n' ' ' | tr -d '\r')"
            echo "::error::${DIAGNOSTIC}"
          fi
          exit "$DOCKER_STATUS"

      - name: Upload run artifacts (evidence, trace, run log)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hw-fast-${{ github.sha }}
          path: |
            /tmp/hw-fast-output.log
            /tmp/hw-fast-build.log
            build/hw/
          if-no-files-found: ignore
