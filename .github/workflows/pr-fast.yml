# Fast-feedback PR pipeline for the portable CANcestry core.
#
# Covers the first two jobs of docs/qa/test-strategy.md section 8.1: host core
# build and host unit tests. Schema validation, firmware cross-build and static
# analysis are added as those areas land.

name: pr-fast

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  host-unit-tests:
    name: unit tests (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          ASAN: ${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCANCESTRY_ENABLE_ASAN=${ASAN}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | tee /tmp/ctest-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: /tmp/ctest-output.log
          if-no-files-found: ignore

  toolchain-checks:
    name: python toolchain (yaml2c, trace_viewer, schemas)
    runs-on: ubuntu-latest
    # contents:write powers the on-failure diagnostic log commit below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tool dependencies
        run: python3 -m pip install --disable-pip-version-check pytest pytest-cov PyYAML jsonschema

      - name: Python unit tests (100% coverage gate, SW-FR-TOOL-*)
        run: |
          python3 -m pytest tests/unit/tools -q \
            --cov=tools/yaml2c --cov=tools/trace_viewer \
            --cov=ci/check_schemas_valid.py --cov-report=term-missing \
            --cov-fail-under=100 2>&1 | tee /tmp/pytest-output.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-toolchain
          path: /tmp/pytest-output.log
          if-no-files-found: ignore

      - name: Schema validation (SW-FR-TOOL-008)
        run: |
          python3 ci/check_schemas_valid.py schemas 2>&1 | tee /tmp/schema-output.log

      - name: Traceability record (Test strategy.md section 10)
        run: |
          python3 ci/check_traceability.py . 2>&1 | tee /tmp/traceability-output.log

      - name: Commit diagnostics on failure (temporary; log storage down)
        if: failure() && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TOKEN: ${{ github.token }}
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B logstage FETCH_HEAD
          mkdir -p .ci-logs
          { python3 --version
            python3 -m pip list 2>/dev/null | grep -Ei 'pytest|coverage|yaml|jsonschema|rpds|referencing'
            for f in pytest-output schema-output traceability-output; do
              echo "===== $f ====="
              cat "/tmp/$f.log" 2>/dev/null
            done
          } > .ci-logs/toolchain-diagnostics.txt 2>&1
          git add .ci-logs
          git commit -m "ci: toolchain diagnostics [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && \
              git push "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" "HEAD:$BRANCH" && break
            sleep 5
          done
