<title id="t2_brownout_001-title">HW-SF-002 T2 brownout / BOR reset timeline - PENDING first run</title>
<desc id="t2_brownout_001-desc">Pending placeholder view per docs/hw/visual-evidence-plan.md section 5: no T2 run of the t2_brownout_001 scenario has executed (issue #64, H-11), so no event markers from a run exist. The intended final view plots the captured brownout timeline on this window - x: emulation time 0..0.050 s; y: labelled event-lane glyphs carrying the exact microsecond stamps of hw/tests/evidence/t2_brownout_001.json: the retention write (the retained terminal code committed BEFORE the brownout), the modelled BOR assertion and the injector stamp at the scheduled 0.010 s brownout boundary, the NRST release 100 us later, the post-reset BOR detection and the safe-state restoration of the REAL v1.0.0 firmware. The 'x' marker of the scheduled_brownout series at 0.010 s records the DETERMINISTIC injection boundary of the scenario (a scenario constant fixed by the modelled plant assertion, not a measurement); the marker at the series origin is an artifact of the renderer's marker cadence and carries no claim. The zero-width hatched band over 0..0.050 s marks the PENDING disposition only; it is not a tolerance claim (HwAGENTS rule 14). Rendering creates no evidence and promotes nothing (HwAGENTS rule 13); the scenario stays sim-pending / CL0 with oracle_id 'none'.</desc>
