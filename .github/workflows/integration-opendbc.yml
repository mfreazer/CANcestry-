# Phase 2.5 integration tests: dbc2codec + opendbc parity harness.
#
# Runs the pytest harness in tests/integration/opendbc-parity, which compiles
# the CANcestry C decoder and checks bit-exact parity against comma.ai
# opendbc's reference parser (QA-H02).

name: integration-opendbc

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  opendbc-parity:
    name: opendbc parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/integration/opendbc-parity/requirements.txt

      - name: Run parity harness
        run: pytest tests/integration/opendbc-parity -q
