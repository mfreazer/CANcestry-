# H-03 nightly hardware evidence job (issue #36, commit 6; HW-PLAN §7/§8.2).
#
# The fast PR gate deliberately does not re-render: it verifies the committed
# bytes against hw/tests/evidence/renders/manifest.json. Only this job proves
# that the committed renderers still reproduce the committed SVGs from the
# pinned plot-data files, which is the only place renderer drift can be
# detected (docs/hw/visual-evidence-plan.md section 6, HwAGENTS.md rule 13).
#
# It reuses the same digest-pinned toolchain image as hw-fast (ci/docker/), and
# re-verifies the base-image digest pin before building so a re-pushed base
# image fails this job instead of silently changing rendered evidence.
#
# --strict is what makes a missing renderer a setup failure: an unavailable
# renderer means the drift check could not run, and a check that could not run
# is not a check that passed.
#
# The same container step runs the H-09 reliability-growth gate
# (ci/check_hw_reliability_growth.py, issue #56): the FMEDA MTBF recomputed by
# the qualified calculator must not drop more than 10 % against the last row
# of hw/fmeda/mtbf-history.csv; a missing or corrupted history fails closed.
#
# The t2-virtual-bench job (issue #55, H-08) is the FIRST live Renode+FMU
# co-simulation: the T2 toolchain image (ci/docker/Dockerfile.t2: the same
# digest-pinned OpenModelica base plus Renode v1.16.1 and the ARM cross
# toolchain) builds the off-tree v1.0.0 firmware ELF, runs the full
# run_t2_retention.py pipeline, and re-runs it with --check to prove the
# evidence is byte-identical across independent runs (determinism gate).
# The H-10 CAN fault scenarios (issue #62) build the second off-tree driver
# (CANCESTRY_T2_DRIVER=can_fault) and run t2_busoff_001 and t2_crc_001,
# each with its --check twin, through the SAME deterministic discipline.
# The H-11 brownout scenario (issue #64) builds the third off-tree driver
# (CANCESTRY_T2_DRIVER=bor_brownout), builds the BOR plant FMU and runs
# t2_brownout_001 with its --check twin the same way.
# It never sets CANCESTRY_HW_ALLOW_SKIP: a missing tool fails loudly.

name: hw-nightly

concurrency:
  group: hw-nightly-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # Daily at 03:17 UTC: off the top of the hour to avoid the scheduler rush.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  hw-nightly:
    name: renderer determinism (--rerender --strict) + reliability growth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the base-image digest pin (ci/docker/base-image.digest)
        id: pin
        run: |
          set -euo pipefail
          PIN_LINES="$(grep -Ev '^[[:space:]]*(#|$)' ci/docker/base-image.digest)"
          REF="$(printf '%s\n' "$PIN_LINES" | sed -n '1p' | tr -d '[:space:]')"
          PINNED="$(printf '%s\n' "$PIN_LINES" | sed -n '2p' | tr -d '[:space:]')"
          RESOLVED="$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "$REF" | jq -r '.digest')"
          test -n "$RESOLVED" && test "$RESOLVED" != "null" || {
            echo "::error::could not resolve a manifest digest for $REF"
            exit 1
          }
          if [ "$PINNED" != "$RESOLVED" ]; then
            echo "::error::${REF} no longer resolves to the pinned digest ${PINNED}; the registry now serves ${RESOLVED}. Re-pin ci/docker/base-image.digest through a documented, QA-visible change instead."
            exit 1
          fi
          echo "image-digest=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Build the toolchain image (ci/docker)
        run: |
          set -euo pipefail
          docker build \
            -t "cancestry/hw-nightly:${GITHUB_SHA}" \
            ci/docker/ 2>&1 | tee /tmp/hw-nightly-build.log

      - name: Verify renderer determinism
        env:
          CANCESTRY_HW_IMAGE: ${{ steps.pin.outputs.image-digest }}
        run: |
          set -euo pipefail
          IMAGE="cancestry/hw-nightly:${GITHUB_SHA}"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CANCESTRY_HW_IMAGE \
            "$IMAGE" bash -lc '
              set -euo pipefail
              echo "== Re-render every committed plot and require byte-identical output"
              python3 ci/check_hw_evidence.py --root . --rerender --strict || {
                echo "::error::hw-nightly failed: a committed renderer no longer reproduces its committed artifact"
                exit 1
              }

              echo "== Reliability growth: FMEDA MTBF vs hw/fmeda/mtbf-history.csv (H-09, HW-NF-004/HW-SF-005)"
              # --no-append: the nightly runner never rewrites tracked files; a
              # changed FMEDA prints the pending row for the PR author to commit.
              python3 ci/check_hw_reliability_growth.py --root . --no-append || {
                echo "::error::hw-nightly failed: MTBF regression (>10 %) or missing/corrupted reliability history"
                exit 1
              }
            ' 2>&1 | tee /tmp/hw-nightly-output.log
          DOCKER_STATUS="${PIPESTATUS[0]}"
          if [ "$DOCKER_STATUS" -ne 0 ]; then
            {
              echo "## hw-nightly output tail"
              echo '```text'
              tail -160 /tmp/hw-nightly-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$(tail -80 /tmp/hw-nightly-output.log | tr '\n' ' ' | tr -d '\r')"
          fi
          exit "$DOCKER_STATUS"

      - name: Upload run artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hw-nightly-${{ github.sha }}
          path: |
            /tmp/hw-nightly-output.log
            /tmp/hw-nightly-build.log
          if-no-files-found: ignore

  t2-virtual-bench:
    name: T2 live co-simulation + determinism check (issue #55)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the job archives tag v1.0.0 for the
          # off-tree firmware ELF build (read-only firmware sources).
          # (actions/checkout input name is fetch-tags; 'tags' is not a
          # valid input and would be silently ignored.)
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the base-image digest pin (ci/docker/base-image.digest)
        id: pin
        run: |
          set -euo pipefail
          PIN_LINES="$(grep -Ev '^[[:space:]]*(#|$)' ci/docker/base-image.digest)"
          REF="$(printf '%s\n' "$PIN_LINES" | sed -n '1p' | tr -d '[:space:]')"
          PINNED="$(printf '%s\n' "$PIN_LINES" | sed -n '2p' | tr -d '[:space:]')"
          RESOLVED="$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "$REF" | jq -r '.digest')"
          test -n "$RESOLVED" && test "$RESOLVED" != "null" || {
            echo "::error::could not resolve a manifest digest for $REF"
            exit 1
          }
          if [ "$PINNED" != "$RESOLVED" ]; then
            echo "::error::${REF} no longer resolves to the pinned digest ${PINNED}; the registry now serves ${RESOLVED}. Re-pin ci/docker/base-image.digest through a documented, QA-visible change instead."
            exit 1
          fi
          echo "image-digest=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Build the T2 toolchain image (ci/docker/Dockerfile.t2)
        run: |
          set -euo pipefail
          # The build log carries the MEASURED sha256 of the pinned Renode
          # asset (the identity pin is ci/docker/renode-1.16.1.pin); the
          # artifact upload below preserves it with the run evidence.
          docker build \
            -f ci/docker/Dockerfile.t2 \
            -t "cancestry/t2:${GITHUB_SHA}" \
            ci/docker/ 2>&1 | tee /tmp/t2-build.log

      - name: Build the off-tree v1.0.0 ELF, run the T2 pipeline twice (--check)
        run: |
          set -euo pipefail
          # Archive the tag v1.0.0 firmware sources on the host runner (the
          # T2 image may not ship git); the container only extracts them.
          git archive --format=tar v1.0.0 -o /tmp/fw-tag.tar
          IMAGE="cancestry/t2:${GITHUB_SHA}"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v /tmp/fw-tag.tar:/fw-tag.tar:ro \
            "$IMAGE" bash -lc '
              set -euo pipefail

              echo "== tag v1.0.0 firmware sources (read-only; git archive on host)"
              mkdir -p /tmp/fw-tag
              tar -x -f /fw-tag.tar -C /tmp/fw-tag
              test -f /tmp/fw-tag/platform/cortex_m/watchdog.c

              echo "== build the off-tree T2 ELF (-O0, pinned cross toolchain)"
              CANCESTRY_T2_FW_TAG_DIR=/tmp/fw-tag \
              CANCESTRY_T2_ELF_OUT=/work/build/hw/t2_firmware_v1.0.0.elf \
              CANCESTRY_T2_BUILD_LOG=/work/build/hw/t2_firmware_build.log \
                bash hw/virtual-bench/firmware/build_firmware.sh

              echo "== RUN 1: full T2 pipeline (live Renode + FMU, writes evidence)"
              # RUN 1 builds the Holdup FMU (omc); its sha256 is recorded in
              # the evidence. RUN 2 and the E2E test reuse that single FMU
              # artifact (--fmu, same contract as the ELF) so the determinism
              # comparison pairs identical FMU bytes - omc packaging is not
              # itself the determinism claim under test.
              CANCESTRY_T2_ELF=/work/build/hw/t2_firmware_v1.0.0.elf \
                python3 hw/virtual-bench/run_t2_retention.py

              echo "== RUN 2: independent re-run; --check requires byte-identical evidence"
              CANCESTRY_T2_ELF=/work/build/hw/t2_firmware_v1.0.0.elf \
                python3 hw/virtual-bench/run_t2_retention.py --check \
                  --fmu /work/build/hw/cancestry_t2_holdup.fmu

              echo "== H-10 (issue #62): build the off-tree CAN fault ELF"
              # Same tag v1.0.0 firmware sources, the can_fault driver,
              # identical build discipline; the driver selection is
              # recorded in the determinism header of the build log.
              CANCESTRY_T2_DRIVER=can_fault \
              CANCESTRY_T2_FW_TAG_DIR=/tmp/fw-tag \
              CANCESTRY_T2_ELF_OUT=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
              CANCESTRY_T2_BUILD_LOG=/work/build/hw/t2_firmware_can_fault_build.log \
                bash hw/virtual-bench/firmware/build_firmware.sh

              echo "== BUSOFF RUN 1: inject at t=10 ms, capture + invariant"
              CANCESTRY_T2_FAULT_ELF=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
                python3 hw/virtual-bench/scenarios/t2_busoff_001.py

              echo "== BUSOFF RUN 2: --check requires byte-identical evidence"
              CANCESTRY_T2_FAULT_ELF=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
                python3 hw/virtual-bench/scenarios/t2_busoff_001.py --check

              echo "== CRC RUN 1: inject at t=10 ms, capture + invariant"
              CANCESTRY_T2_FAULT_ELF=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
                python3 hw/virtual-bench/scenarios/t2_crc_001.py

              echo "== CRC RUN 2: --check requires byte-identical evidence"
              CANCESTRY_T2_FAULT_ELF=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
                python3 hw/virtual-bench/scenarios/t2_crc_001.py --check

              echo "== H-11 (issue #64): build the off-tree brownout ELF"
              # Same tag v1.0.0 firmware sources, the bor_brownout driver,
              # identical build discipline.
              CANCESTRY_T2_DRIVER=bor_brownout \
              CANCESTRY_T2_FW_TAG_DIR=/tmp/fw-tag \
              CANCESTRY_T2_ELF_OUT=/work/build/hw/t2_firmware_v1.0.0_bor_brownout.elf \
              CANCESTRY_T2_BUILD_LOG=/work/build/hw/t2_firmware_bor_brownout_build.log \
                bash hw/virtual-bench/firmware/build_firmware.sh

              echo "== BROWNOUT RUN 1: modelled BOR assertion at t=10 ms, capture + invariants"
              # RUN 1 builds the BOR plant FMU (omc) and writes the evidence;
              # its sha256 is recorded in the artifact and reused by RUN 2 so
              # the determinism comparison pairs identical FMU bytes.
              CANCESTRY_T2_BOR_ELF=/work/build/hw/t2_firmware_v1.0.0_bor_brownout.elf \
                python3 hw/virtual-bench/scenarios/t2_brownout_001.py

              echo "== BROWNOUT RUN 2: --check requires byte-identical evidence"
              CANCESTRY_T2_BOR_ELF=/work/build/hw/t2_firmware_v1.0.0_bor_brownout.elf \
                python3 hw/virtual-bench/scenarios/t2_brownout_001.py --check \
                  --fmu /work/build/hw/cancestry_t2_bor.fmu

              echo "== bridge/orchestrator test suite on the live toolchain"
              # F-36 (issue #60, dispatch 25): the e2e test fail-closes
              # without CANCESTRY_T2_ELF (H-07: no silent downgrade), and
              # RUN 1/RUN 2 each received it inline - the pytest line did
              # not, so the first run of this suite went red on
              # "T2 toolchain not found". Same env, same contract.
              # F-37: this block is one single-quoted string passed to
              # bash -lc - never put a raw apostrophe in it;
              # tests/unit/tools/test_check_hw_workflow_bash_syntax.py
              # enforces bash -n over every run block.
              # H-10: CANCESTRY_T2_FAULT_ELF points the fault-scenario e2e
              # tests at the can_fault ELF (they never fall back to the
              # retention ELF silently - separate env var, explicit).
              # H-11: CANCESTRY_T2_BOR_ELF does the same for the brownout
              # scenario e2e test (no silent fallback to another ELF).
              CANCESTRY_T2_ELF=/work/build/hw/t2_firmware_v1.0.0.elf \
              CANCESTRY_T2_FAULT_ELF=/work/build/hw/t2_firmware_v1.0.0_can_fault.elf \
              CANCESTRY_T2_BOR_ELF=/work/build/hw/t2_firmware_v1.0.0_bor_brownout.elf \
                python3 -m pytest hw/virtual-bench -q
            ' 2>&1 | tee /tmp/t2-output.log
          DOCKER_STATUS="${PIPESTATUS[0]}"
          if [ "$DOCKER_STATUS" -ne 0 ]; then
            {
              echo "## t2-virtual-bench output tail"
              echo '```text'
              tail -160 /tmp/t2-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # F-25 (issue #55): the runner's T2-DIAG line (the failure
            # output's final line, <=1000 chars) carries the whole
            # bring-up state; prefer it for the error annotation instead
            # of a space-joined tail that GitHub truncates at 1000 chars
            # before the diagnostic line is reached (dispatch 15, run
            # 35777946390).
            DIAG_LINE="$(grep '^T2-DIAG ' /tmp/t2-output.log | tail -1 || true)"
            if [ -n "$DIAG_LINE" ]; then
              echo "::error::${DIAG_LINE}"
            else
              echo "::error::$(tail -5 /tmp/t2-output.log | tr '\n' ' ' | tr -d '\r')"
            fi
          fi
          exit "$DOCKER_STATUS"

      # F-35 (issue #60, dispatch 24): Dockerfile.t2 has no USER
      # directive, so RUN 1/RUN 2 write root-owned files into build/hw/
      # (ELF, runlog, trace) and hw/tests/evidence/ (the written JSON)
      # on the host runner. upload-artifact runs as the runner user and
      # could not read them - "error while creating the zip file" on
      # runs 19/20/21 for build/hw/, still failing at dispatch 24 -
      # while host-owned /tmp logs always uploaded. Re-label the trees
      # readable so a PASSING run's evidence persists. sudo is required:
      # the runner user cannot chmod files it does not own.
      - name: Make container-written artifacts readable (F-35)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo chmod -R a+rX build/hw hw/tests/evidence 2>/dev/null || true

      # F-33 (issue #60, dispatch 21): the combined zip failed on runs
      # 19/20/21 ("error while creating the zip file"), which killed the
      # only persistent copy of the failure output (console tail +
      # full transcript printed by the runner). The /tmp logs upload is
      # the same /tmp-only shape the renderer job's artifact (which has
      # always succeeded) uses - land it FIRST so a poisoned build/hw/
      # (Dockerfile.t2 has no USER directive: files are root-owned on the
      # runner) can no longer take the diagnostic logs down with it.
      - name: Upload T2 CI logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: t2-ci-logs-${{ github.sha }}
          path: |
            /tmp/t2-output.log
            /tmp/t2-build.log
          if-no-files-found: ignore

      - name: Upload T2 run artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: t2-virtual-bench-${{ github.sha }}
          path: |
            build/hw/
            hw/tests/evidence/
            /tmp/t2-output.log
            /tmp/t2-build.log
          if-no-files-found: ignore
